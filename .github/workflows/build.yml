name: Build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleRelease testDebugUnitTest lintDebug

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Keep APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Check the tag against the app version
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      # Signs only when the repository has the keystore secrets; otherwise the release
      # carries the unsigned APK to be signed by hand.
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          name="intercom-satellite-${GITHUB_REF_NAME#v}"
          if [ -z "$KEYSTORE" ]; then
            mv app-release-unsigned.apk "$name-unsigned.apk"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          alias=()
          if [ -n "$KEY_ALIAS" ]; then alias=(--ks-key-alias "$KEY_ALIAS"); fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD "${alias[@]}" --key-pass env:KEY_PASSWORD \
            --out "$name.apk" app-release-unsigned.apk
          "$apksigner" verify "$name.apk"
          rm "$RUNNER_TEMP/release.jks" app-release-unsigned.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Intercom Satellite ${GITHUB_REF_NAME#v}" --generate-notes intercom-satellite-*.apk
